name: Public testnet bug
description: Report a reproducible Fortune BSC Testnet alpha problem
title: "[testnet] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Fortune. Public testnet uses valueless test assets only.
        Use the **Copy diagnostics** button on the Fortune testnet page when possible.
        **Never paste a seed phrase, private key, wallet backup, API secret, or recovery phrase into an issue.**
  - type: textarea
    id: diagnostics
    attributes:
      label: Fortune diagnostics
      description: Paste the JSON produced by the Copy diagnostics button. It contains public addresses/transaction state only.
      render: json
  - type: input
    id: tx
    attributes:
      label: Transaction hash
      description: If an onchain action was submitted, paste the BSC Testnet transaction hash.
      placeholder: "0x..."
  - type: input
    id: token
    attributes:
      label: Token or curve address
      description: Optional. Paste the public testnet token or curve address involved.
      placeholder: "0x..."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Wallet / network
        - Testnet faucet
        - Create launch
        - Creator first buy
        - Curve buy
        - Graduation / Pancake
        - LP lock
        - Tax processing / dividends
        - API / readiness
        - UI / recovery
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, and what happened? Note whether BscScan shows the transaction as confirmed, failed, or missing.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser / wallet
      description: Browser and wallet extension/app. Never include credentials or recovery material.
