name: Fortune CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Validate mainnet release manifest
        run: npm run mainnet:check
      - name: Validate pinned mainnet dependencies
        run: npm run mainnet:deps
      - name: Web transaction and factory-catalog regressions
        run: node --import ./scripts/register-ts.mjs --test tests/web/*.test.mjs
      - run: npm run build

      - name: Boot production server
        run: |
          npm run start > /tmp/fortune-next.log 2>&1 &
          echo $! > /tmp/fortune-next.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/fortune-next.pid)" 2>/dev/null; then
              echo "Fortune production server exited before becoming healthy."
              cat /tmp/fortune-next.log
              exit 1
            fi

            sleep 1
          done

          echo "Fortune production server did not become healthy."
          cat /tmp/fortune-next.log
          exit 1

      - name: Production-runtime smoke gate
        run: npm run smoke:release

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/fortune-next.log || true

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.3
      - name: Install Solidity libraries
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@69c8def5f222ff96f2b5beff05dfba996368aa79 --no-commit
          forge install foundry-rs/forge-std@8bbcf6e3f8f62f419e5429a0bd89331c85c37824 --no-commit
      - name: Contract tests + 1,000-run fuzz suite
        run: forge test --fuzz-runs 1000 -vvv
