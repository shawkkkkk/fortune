name: Custom Pairs Beta (unaudited)

on:
  push:
    branches: [main]
    paths:
      - "contracts-custom-pairs/**"
      - "lib/custom-pairs-artifacts.ts"
      - "scripts/export-custom-pair-artifacts.mjs"
      - ".github/workflows/custom-pairs-beta.yml"
  pull_request:
    paths:
      - "contracts-custom-pairs/**"
      - "lib/custom-pairs-artifacts.ts"
      - "scripts/export-custom-pair-artifacts.mjs"
      - ".github/workflows/custom-pairs-beta.yml"
  workflow_dispatch:

jobs:
  unit-fuzz-invariant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.3
      - name: Install pinned Solidity libraries
        working-directory: contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@69c8def5f222ff96f2b5beff05dfba996368aa79 --no-commit
          forge install foundry-rs/forge-std@8bbcf6e3f8f62f419e5429a0bd89331c85c37824 --no-commit
      - name: Contract sizes stay under EIP-170
        working-directory: contracts-custom-pairs
        run: forge build --sizes
      - name: Website ABIs and inspector probe match the contracts
        run: node scripts/export-custom-pair-artifacts.mjs --check
      - name: Unit, 1,000-run fuzz and invariant suites
        working-directory: contracts-custom-pairs
        run: forge test --no-match-contract Fork --fuzz-runs 1000 -vv

  bsc-mainnet-fork:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BSC_FORK_RPC_URL: ${{ secrets.BSC_MAINNET_FORK_RPC_URL || 'https://bsc-dataseed.bnbchain.org' }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.3
      - name: Install pinned Solidity libraries
        working-directory: contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@69c8def5f222ff96f2b5beff05dfba996368aa79 --no-commit
          forge install foundry-rs/forge-std@8bbcf6e3f8f62f419e5429a0bd89331c85c37824 --no-commit
      - name: Real PancakeSwap V2 lifecycle on a BSC mainnet fork
        working-directory: contracts-custom-pairs
        run: forge test --match-contract FortuneCustomPairForkTest -vv
