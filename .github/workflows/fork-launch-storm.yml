name: Fortune Fork Launch Storm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_STORM to confirm the forked full-stack stress drill"
        required: true
        type: string
      stages:
        description: "HTTP concurrency x request stages"
        required: true
        default: "50x500,200x2000,500x5000"
        type: string
      p95_limit_ms:
        description: "Maximum acceptable stage p95 latency"
        required: true
        default: "2500"
        type: string
      graduation_repeats:
        description: "Number of end-to-end Pancake graduations to run on the local BSC fork"
        required: true
        default: "3"
        type: string

jobs:
  storm:
    if: ${{ inputs.confirm == 'RUN_STORM' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    env:
      UPSTREAM_BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
      LOCAL_RPC_URL: "http://127.0.0.1:8545"
      BASE_URL: "http://127.0.0.1:3000"
      STAGES: ${{ inputs.stages }}
      P95_LIMIT_MS: ${{ inputs.p95_limit_ms }}
      SUCCESS_FLOOR: "0.995"
      TIMEOUT_MS: "8000"
      REPORT_PATH: "/tmp/fortune-launch-storm-report.json"
      PANCAKE_V3_FACTORY: "0x0BFbCF9fa4f9C56B0F40a671Ad40E0805A091865"
      PANCAKE_V3_POSITION_MANAGER: "0x427bF5b37357632377eCbEC9de3626C71A5396c1"

      NEXT_PUBLIC_CHAIN_ID: "97"

      LIVE_CURVE: "0x5E7967bde6286aE030bFd45FbB8650df221F22e9"
      LIVE_TOKEN: "0xC27aF82E8A228a0167FbE1673CaD13cD35Ee16Fe"
      LIVE_QUOTE: "0x871356a53Dd988EFDAa82261c9d212Ac08988fd0"
      LIVE_POOL: "0x5c9fAB9ee5286fE5c071Bd547f9B308a550FA50f"
      LIVE_LOCKER: "0x861Deb497eA845dda8727B11462d11Abe34E2AE8"
      LIVE_LP_TOKEN_ID: "37496"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Validate inputs and RPC secret
        run: |
          test -n "$UPSTREAM_BSC_TESTNET_RPC_URL" || (echo "Missing BSC_TESTNET_RPC_URL secret" && exit 1)
          case "${{ inputs.graduation_repeats }}" in
            ''|*[!0-9]*) echo "graduation_repeats must be an integer"; exit 1 ;;
          esac
          test "${{ inputs.graduation_repeats }}" -ge 1 || (echo "graduation_repeats must be >= 1" && exit 1)
          test "${{ inputs.graduation_repeats }}" -le 10 || (echo "graduation_repeats must be <= 10" && exit 1)

      - name: Verify successful real BSC testnet drill directly
        env:
          RPC_URL: ${{ env.UPSTREAM_BSC_TESTNET_RPC_URL }}
          CURVE_ADDRESS: ${{ env.LIVE_CURVE }}
          TOKEN_ADDRESS: ${{ env.LIVE_TOKEN }}
          QUOTE_ADDRESS: ${{ env.LIVE_QUOTE }}
          POOL_ADDRESS: ${{ env.LIVE_POOL }}
          LOCKER_ADDRESS: ${{ env.LIVE_LOCKER }}
          POSITION_MANAGER_ADDRESS: ${{ env.PANCAKE_V3_POSITION_MANAGER }}
          LP_TOKEN_ID: ${{ env.LIVE_LP_TOKEN_ID }}
          MAX_PRICE_DEVIATION_BPS: "100"
        run: node scripts/verify-graduation-state.mjs

      - name: Start isolated BSC testnet fork
        run: |
          anvil \
            --fork-url "$UPSTREAM_BSC_TESTNET_RPC_URL" \
            --chain-id 97 \
            --host 127.0.0.1 \
            --port 8545 \
            --block-time 1 \
            > /tmp/anvil.log 2>&1 &
          echo $! > /tmp/anvil.pid

          for i in {1..60}; do
            if cast chain-id --rpc-url "$LOCAL_RPC_URL" >/tmp/fork-chain-id 2>/dev/null; then
              break
            fi
            sleep 1
          done

          CHAIN_ID=$(cat /tmp/fork-chain-id)
          test "$CHAIN_ID" = "97" || (cat /tmp/anvil.log && echo "Fork did not start on chain 97" && exit 1)

          LOCAL_KEY="0x$(openssl rand -hex 32)"
          LOCAL_SIGNER=$(cast wallet address --private-key "$LOCAL_KEY")
          cast rpc --rpc-url "$LOCAL_RPC_URL" anvil_setBalance \
            "$LOCAL_SIGNER" \
            0x3635C9ADC5DEA00000 >/dev/null

          # Forge otherwise simulates scripts from its built-in default sender
          # (0x1804...), which makes Anvil lazily fetch that account from the
          # upstream testnet node. Some public BSC testnet RPCs cannot serve
          # the required trie node. Force every script simulation to use the
          # locally-created funded signer instead.
          cast rpc --rpc-url "$LOCAL_RPC_URL" anvil_setBalance \
            0x1804c8AB1F12E6bbf3894d4083f33e07309d1f38 \
            0x3635C9ADC5DEA00000 >/dev/null

          {
            echo "PRIVATE_KEY=$LOCAL_KEY"
            echo "LOCAL_SIGNER=$LOCAL_SIGNER"
            echo "FOUNDRY_SENDER=$LOCAL_SIGNER"
            echo "FOUNDRY_TX_ORIGIN=$LOCAL_SIGNER"
          } >> "$GITHUB_ENV"

          test "$(cast code "$PANCAKE_V3_FACTORY" --rpc-url "$LOCAL_RPC_URL")" != "0x"
          test "$(cast code "$PANCAKE_V3_POSITION_MANAGER" --rpc-url "$LOCAL_RPC_URL")" != "0x"

      - name: Install Solidity libraries
        working-directory: contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: Run contract suite before storm
        working-directory: contracts
        run: forge test --fuzz-runs 1000 -vvv

      - name: Seed a fresh graduated Fortune launch on the fork
        working-directory: contracts
        run: |
          forge script script/PancakeTestnetDrill.s.sol:PancakeTestnetDrill \
            --rpc-url "$LOCAL_RPC_URL" \
            --broadcast \
            --slow \
            --sender "$LOCAL_SIGNER" \
            --with-gas-price 1000000000 \
            --priority-gas-price 1000000000 \
            -vvv 2>&1 | tee /tmp/seed-graduation.log

          FACTORY=$(awk '/^  FortuneFactory 0x/{v=$2} END{print v}' /tmp/seed-graduation.log)
          REGISTRY=$(awk '/^  FortuneAssetRegistry 0x/{v=$2} END{print v}' /tmp/seed-graduation.log)
          ADAPTER=$(awk '/^  FortunePancakeV3GraduationAdapter 0x/{v=$2} END{print v}' /tmp/seed-graduation.log)
          LOCKER=$(awk '/^  FortunePermanentLiquidityLocker 0x/{v=$2} END{print v}' /tmp/seed-graduation.log)
          TOKEN=$(awk '/^  LaunchToken 0x/{v=$2} END{print v}' /tmp/seed-graduation.log)
          CURVE=$(awk '/^  FortuneCurve 0x/{v=$2} END{print v}' /tmp/seed-graduation.log)
          QUOTE=$(awk '/^  MockQuote 0x/{v=$2} END{print v}' /tmp/seed-graduation.log)
          LP_TOKEN_ID=$(awk '/^  LPPositionTokenId /{v=$2} END{print v}' /tmp/seed-graduation.log)

          for value in "$FACTORY" "$REGISTRY" "$ADAPTER" "$LOCKER" "$TOKEN" "$CURVE" "$QUOTE" "$LP_TOKEN_ID"; do
            test -n "$value" || (echo "Failed to parse seed deployment addresses" && exit 1)
          done

          POOL=$(cast call "$PANCAKE_V3_FACTORY" \
            "getPool(address,address,uint24)(address)" \
            "$TOKEN" "$QUOTE" 500 \
            --rpc-url "$LOCAL_RPC_URL")
          test "$POOL" != "0x0000000000000000000000000000000000000000" || (echo "Seed Pancake pool missing" && exit 1)

          {
            echo "NEXT_PUBLIC_FORTUNE_FACTORY_ADDRESS=$FACTORY"
            echo "NEXT_PUBLIC_FORTUNE_REGISTRY_ADDRESS=$REGISTRY"
            echo "NEXT_PUBLIC_FORTUNE_GRADUATION_ADAPTER_ADDRESS=$ADAPTER"
            echo "NEXT_PUBLIC_FORTUNE_LIQUIDITY_LOCKER_ADDRESS=$LOCKER"
            echo "FORTUNE_REGISTRY=$REGISTRY"
            echo "FORTUNE_GRADUATION_ADAPTER=$ADAPTER"
            echo "FORTUNE_LIQUIDITY_LOCKER=$LOCKER"
            echo "SEED_CURVE=$CURVE"
            echo "SEED_TOKEN=$TOKEN"
            echo "SEED_QUOTE=$QUOTE"
            echo "SEED_POOL=$POOL"
            echo "SEED_LP_TOKEN_ID=$LP_TOKEN_ID"
          } >> "$GITHUB_ENV"

      - name: Verify fresh fork graduation state
        run: |
          RPC_URL="$LOCAL_RPC_URL" \
          CURVE_ADDRESS="$SEED_CURVE" \
          TOKEN_ADDRESS="$SEED_TOKEN" \
          QUOTE_ADDRESS="$SEED_QUOTE" \
          POOL_ADDRESS="$SEED_POOL" \
          LOCKER_ADDRESS="$NEXT_PUBLIC_FORTUNE_LIQUIDITY_LOCKER_ADDRESS" \
          POSITION_MANAGER_ADDRESS="$PANCAKE_V3_POSITION_MANAGER" \
          LP_TOKEN_ID="$SEED_LP_TOKEN_ID" \
          MAX_PRICE_DEVIATION_BPS="100" \
          node scripts/verify-graduation-state.mjs


      - name: Install and build Fortune web against fork
        env:
          BSC_TESTNET_RPC_URL: ${{ env.LOCAL_RPC_URL }}
        run: |
          npm install
          npm run build

      - name: Start Fortune web
        env:
          BSC_TESTNET_RPC_URL: ${{ env.LOCAL_RPC_URL }}
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/fortune-web.log 2>&1 &
          echo $! > /tmp/fortune-web.pid

          for i in {1..60}; do
            if curl -fsS "$BASE_URL/api/ready" >/tmp/fortune-ready.json 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat /tmp/fortune-ready.json || true
          curl -fsS "$BASE_URL/api/ready" >/dev/null || (cat /tmp/fortune-web.log && exit 1)

      - name: Run concurrent web storm and forked Pancake graduations
        env:
          BSC_TESTNET_RPC_URL: ${{ env.LOCAL_RPC_URL }}
        run: |
          (
            cd contracts
            for i in $(seq 1 "${{ inputs.graduation_repeats }}"); do
              echo "=== Fork graduation $i/${{ inputs.graduation_repeats }} ==="
              forge script script/PancakeTestnetDrill.s.sol:PancakeTestnetDrill \
                --rpc-url "$LOCAL_RPC_URL" \
                --broadcast \
                --slow \
                --with-gas-price 1000000000 \
                --priority-gas-price 1000000000 \
                -vvv
            done
          ) > /tmp/fork-graduations.log 2>&1 &
          GRAD_PID=$!

          set +e
          node scripts/launch-storm.mjs
          STORM_EXIT=$?
          wait "$GRAD_PID"
          GRAD_EXIT=$?
          set -e

          if [ "$GRAD_EXIT" -ne 0 ]; then
            echo "Forked onchain graduation storm failed."
            cat /tmp/fork-graduations.log
            exit "$GRAD_EXIT"
          fi

          if [ "$STORM_EXIT" -ne 0 ]; then
            echo "HTTP launch storm missed its release gate."
            cat "$REPORT_PATH" || true
            exit "$STORM_EXIT"
          fi

          COUNT=$(grep -c "ONCHAIN EXECUTION COMPLETE & SUCCESSFUL" /tmp/fork-graduations.log || true)
          test "$COUNT" -ge "${{ inputs.graduation_repeats }}" || \
            (echo "Expected ${{ inputs.graduation_repeats }} successful fork graduations, found $COUNT" && cat /tmp/fork-graduations.log && exit 1)

      - name: Re-verify seed graduation invariants after storm
        run: |
          RPC_URL="$LOCAL_RPC_URL" \
          CURVE_ADDRESS="$SEED_CURVE" \
          TOKEN_ADDRESS="$SEED_TOKEN" \
          QUOTE_ADDRESS="$SEED_QUOTE" \
          POOL_ADDRESS="$SEED_POOL" \
          LOCKER_ADDRESS="$NEXT_PUBLIC_FORTUNE_LIQUIDITY_LOCKER_ADDRESS" \
          POSITION_MANAGER_ADDRESS="$PANCAKE_V3_POSITION_MANAGER" \
          LP_TOKEN_ID="$SEED_LP_TOKEN_ID" \
          MAX_PRICE_DEVIATION_BPS="100" \
          node scripts/verify-graduation-state.mjs

      - name: Show storm summary
        if: always()
        run: |
          echo "=== HTTP Launch Storm ==="
          cat "$REPORT_PATH" 2>/dev/null || true
          echo "=== Seed graduation ==="
          grep -E "Script ran successfully|ONCHAIN EXECUTION COMPLETE|PancakePoolGraduated|LiquidityPositionLocked" /tmp/seed-graduation.log 2>/dev/null | tail -40 || true
          echo "=== Forked graduation markers ==="
          grep -E "Script ran successfully|ONCHAIN EXECUTION COMPLETE|PancakePoolGraduated|LiquidityPositionLocked" /tmp/fork-graduations.log 2>/dev/null | tail -80 || true

      - name: Upload storm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortune-fork-launch-storm
          path: |
            /tmp/fortune-launch-storm-report.json
            /tmp/seed-graduation.log
            /tmp/fork-graduations.log
            /tmp/fortune-web.log
            /tmp/anvil.log
          if-no-files-found: warn
          retention-days: 14
