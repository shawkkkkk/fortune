name: Fortune BSC Testnet Launch Storm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_STORM to confirm real BSC testnet stress testing"
        required: true
        type: string
      stages:
        description: "HTTP concurrency x request stages"
        required: true
        default: "50x500,200x2000,500x5000"
        type: string
      p95_limit_ms:
        description: "Maximum acceptable stage p95 latency"
        required: true
        default: "2500"
        type: string
      graduation_repeats:
        description: "Number of real BSC testnet Pancake graduations to run"
        required: true
        default: "3"
        type: string

jobs:
  storm:
    if: ${{ inputs.confirm == 'RUN_STORM' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      BASE_URL: "http://127.0.0.1:3000"
      STAGES: ${{ inputs.stages }}
      P95_LIMIT_MS: ${{ inputs.p95_limit_ms }}
      SUCCESS_FLOOR: "0.995"
      TIMEOUT_MS: "8000"
      INCLUDE_RPC_CHECKS: "false"
      REPORT_PATH: "/tmp/fortune-launch-storm-report.json"

      NEXT_PUBLIC_CHAIN_ID: "97"
      NEXT_PUBLIC_FORTUNE_FACTORY_ADDRESS: "0x9Eac6c6CdA0A19cbb0f8Abc51Ee968545E6EB415"
      NEXT_PUBLIC_FORTUNE_REGISTRY_ADDRESS: "0x943176d26A332F4687d52695fe9625866c2c3A67"
      NEXT_PUBLIC_FORTUNE_GRADUATION_ADAPTER_ADDRESS: "0xF666487e58dEFB8584C7eAa2378DEe1BbAbe012C"
      NEXT_PUBLIC_FORTUNE_LIQUIDITY_LOCKER_ADDRESS: "0x861Deb497eA845dda8727B11462d11Abe34E2AE8"

      FORTUNE_REGISTRY: "0x943176d26A332F4687d52695fe9625866c2c3A67"
      FORTUNE_GRADUATION_ADAPTER: "0xF666487e58dEFB8584C7eAa2378DEe1BbAbe012C"
      FORTUNE_LIQUIDITY_LOCKER: "0x861Deb497eA845dda8727B11462d11Abe34E2AE8"

      PANCAKE_V3_FACTORY: "0x0BFbCF9fa4f9C56B0F40a671Ad40E0805A091865"
      PANCAKE_V3_POSITION_MANAGER: "0x427bF5b37357632377eCbEC9de3626C71A5396c1"

      LIVE_CURVE: "0x5E7967bde6286aE030bFd45FbB8650df221F22e9"
      LIVE_TOKEN: "0xC27aF82E8A228a0167FbE1673CaD13cD35Ee16Fe"
      LIVE_QUOTE: "0x871356a53Dd988EFDAa82261c9d212Ac08988fd0"
      LIVE_POOL: "0x5c9fAB9ee5286fE5c071Bd547f9B308a550FA50f"
      LIVE_LOCKER: "0x861Deb497eA845dda8727B11462d11Abe34E2AE8"
      LIVE_LP_TOKEN_ID: "37496"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Validate testnet secrets and inputs
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          FORTUNE_TESTNET_PRIVATE_KEY: ${{ secrets.FORTUNE_TESTNET_PRIVATE_KEY }}
          GRADUATION_REPEATS: ${{ inputs.graduation_repeats }}
        run: |
          test -n "$BSC_TESTNET_RPC_URL" || (echo "Missing BSC_TESTNET_RPC_URL secret" && exit 1)
          test -n "$FORTUNE_TESTNET_PRIVATE_KEY" || (echo "Missing FORTUNE_TESTNET_PRIVATE_KEY secret" && exit 1)

          case "$GRADUATION_REPEATS" in
            ''|*[!0-9]*) echo "graduation_repeats must be an integer"; exit 1 ;;
          esac
          test "$GRADUATION_REPEATS" -ge 1 || (echo "graduation_repeats must be >= 1" && exit 1)
          test "$GRADUATION_REPEATS" -le 5 || (echo "graduation_repeats must be <= 5" && exit 1)

          CHAIN_ID=$(cast chain-id --rpc-url "$BSC_TESTNET_RPC_URL")
          test "$CHAIN_ID" = "97" || (echo "RPC must be BSC testnet chain 97" && exit 1)

          WALLET=$(cast wallet address --private-key "$FORTUNE_TESTNET_PRIVATE_KEY")
          BALANCE_WEI=$(cast balance "$WALLET" --rpc-url "$BSC_TESTNET_RPC_URL")
          REQUIRED_WEI=$(python3 -c "print(int($GRADUATION_REPEATS) * 50000000000000000)")

          echo "Testnet deployer: $WALLET"
          echo "Testnet balance: $(cast balance "$WALLET" --ether --rpc-url "$BSC_TESTNET_RPC_URL") tBNB"
          echo "Required safety budget: 0.05 tBNB per requested graduation"

          test "$BALANCE_WEI" -ge "$REQUIRED_WEI" || \
            (echo "Insufficient tBNB safety budget for requested graduation count" && exit 1)

      - name: Verify existing real BSC testnet graduation
        env:
          RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          CURVE_ADDRESS: ${{ env.LIVE_CURVE }}
          TOKEN_ADDRESS: ${{ env.LIVE_TOKEN }}
          QUOTE_ADDRESS: ${{ env.LIVE_QUOTE }}
          POOL_ADDRESS: ${{ env.LIVE_POOL }}
          LOCKER_ADDRESS: ${{ env.LIVE_LOCKER }}
          POSITION_MANAGER_ADDRESS: ${{ env.PANCAKE_V3_POSITION_MANAGER }}
          LP_TOKEN_ID: ${{ env.LIVE_LP_TOKEN_ID }}
          MAX_PRICE_DEVIATION_BPS: "100"
        run: node scripts/verify-graduation-state.mjs

      - name: Install Solidity libraries
        working-directory: contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: Run contract suite before storm
        working-directory: contracts
        run: forge test --fuzz-runs 1000 -vvv

      - name: Install and build Fortune web against live testnet
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
        run: |
          npm install
          npm run build

      - name: Start Fortune web against live testnet
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/fortune-web.log 2>&1 &
          echo $! > /tmp/fortune-web.pid

          for i in {1..60}; do
            if curl -fsS "$BASE_URL/api/ready" >/tmp/fortune-ready.json 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat /tmp/fortune-ready.json || true
          curl -fsS "$BASE_URL/api/ready" >/dev/null || (cat /tmp/fortune-web.log && exit 1)

      - name: Readiness dependency smoke before storm
        run: |
          for i in {1..10}; do
            curl -fsS "$BASE_URL/api/ready" >/dev/null
            BODY=$(curl -fsS "$BASE_URL/api/public/v1/readiness")
            node -e 'const x=JSON.parse(process.argv[1]); if (!x.data || x.data.ready !== true) process.exit(1)' "$BODY"
          done

      - name: Run concurrent web storm and real testnet Pancake graduations
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.FORTUNE_TESTNET_PRIVATE_KEY }}
          GRADUATION_REPEATS: ${{ inputs.graduation_repeats }}
        run: |
          (
            cd contracts
            for i in $(seq 1 "$GRADUATION_REPEATS"); do
              echo "=== Real BSC testnet graduation $i/$GRADUATION_REPEATS ==="
              forge script script/PancakeTestnetDrill.s.sol:PancakeTestnetDrill \
                --rpc-url "$BSC_TESTNET_RPC_URL" \
                --broadcast \
                --slow \
                --with-gas-price 1000000000 \
                --priority-gas-price 1000000000 \
                -vvv
            done
          ) > /tmp/testnet-graduations.log 2>&1 &
          GRAD_PID=$!

          set +e
          node scripts/launch-storm.mjs
          STORM_EXIT=$?
          wait "$GRAD_PID"
          GRAD_EXIT=$?
          set -e

          if [ "$GRAD_EXIT" -ne 0 ]; then
            echo "Real BSC testnet graduation storm failed."
            tail -250 /tmp/testnet-graduations.log
            exit "$GRAD_EXIT"
          fi

          if [ "$STORM_EXIT" -ne 0 ]; then
            echo "HTTP launch storm missed its release gate."
            cat "$REPORT_PATH" || true
            exit "$STORM_EXIT"
          fi

          COUNT=$(grep -c "ONCHAIN EXECUTION COMPLETE & SUCCESSFUL" /tmp/testnet-graduations.log || true)
          test "$COUNT" -ge "$GRADUATION_REPEATS" || \
            (echo "Expected $GRADUATION_REPEATS successful real testnet graduations, found $COUNT" && tail -250 /tmp/testnet-graduations.log && exit 1)

      - name: Readiness dependency smoke after storm
        run: |
          for i in {1..10}; do
            curl -fsS "$BASE_URL/api/ready" >/dev/null
            BODY=$(curl -fsS "$BASE_URL/api/public/v1/readiness")
            node -e 'const x=JSON.parse(process.argv[1]); if (!x.data || x.data.ready !== true) process.exit(1)' "$BODY"
          done

      - name: Re-verify existing live graduation invariants
        env:
          RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          CURVE_ADDRESS: ${{ env.LIVE_CURVE }}
          TOKEN_ADDRESS: ${{ env.LIVE_TOKEN }}
          QUOTE_ADDRESS: ${{ env.LIVE_QUOTE }}
          POOL_ADDRESS: ${{ env.LIVE_POOL }}
          LOCKER_ADDRESS: ${{ env.LIVE_LOCKER }}
          POSITION_MANAGER_ADDRESS: ${{ env.PANCAKE_V3_POSITION_MANAGER }}
          LP_TOKEN_ID: ${{ env.LIVE_LP_TOKEN_ID }}
          MAX_PRICE_DEVIATION_BPS: "100"
        run: node scripts/verify-graduation-state.mjs

      - name: Show storm summary
        if: always()
        run: |
          echo "=== HTTP Launch Storm ==="
          cat "$REPORT_PATH" 2>/dev/null || true
          echo "=== Real BSC testnet graduation markers ==="
          grep -E "Script ran successfully|ONCHAIN EXECUTION COMPLETE|PancakePoolGraduated|LiquidityPositionLocked" /tmp/testnet-graduations.log 2>/dev/null | tail -120 || true

      - name: Upload storm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortune-bsc-testnet-launch-storm
          path: |
            /tmp/fortune-launch-storm-report.json
            /tmp/testnet-graduations.log
            /tmp/fortune-web.log
          if-no-files-found: warn
          retention-days: 14
