name: Fortune Generate Node Lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-node-lockfile.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package lock without running package scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate generated lock
        run: |
          test -s package-lock.json
          node -e 'const p=require("./package-lock.json"); if (p.lockfileVersion < 3) process.exit(1)'

      - name: Publish lockfile only
        run: |
          git config user.name "fortune-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          test "$(git diff --cached --name-only)" = "package-lock.json"
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git commit -m "Lock Node dependencies for reproducible releases"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
