name: Fortune Mainnet Deploy Paused

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_FORTUNE_MAINNET_PAUSED"
        required: true
        type: string

concurrency:
  group: fortune-mainnet-deploy
  cancel-in-progress: false

jobs:
  deploy-paused:
    if: ${{ inputs.confirm == 'DEPLOY_FORTUNE_MAINNET_PAUSED' }}
    runs-on: ubuntu-latest
    environment: mainnet
    permissions:
      contents: read

    env:
      PRIVATE_KEY: ${{ secrets.FORTUNE_MAINNET_DEPLOYER_PRIVATE_KEY }}
      BSC_RPC_URL: ${{ secrets.BSC_MAINNET_RPC_URL }}

      FORTUNE_GOVERNANCE: ${{ vars.FORTUNE_GOVERNANCE }}
      FORTUNE_AUTOMATION_EXECUTOR: ${{ vars.FORTUNE_AUTOMATION_EXECUTOR }}
      FORTUNE_PROTOCOL_TREASURY: ${{ vars.FORTUNE_PROTOCOL_TREASURY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Require deploy-ready release evidence
        run: npm run mainnet:require-deploy

      - name: Require pinned production dependencies and assets
        run: npm run mainnet:deps:require

      - name: Export reviewed dependency manifest
        run: node scripts/export-mainnet-dependencies.mjs >> "$GITHUB_ENV"

      - name: Require reviewed security-critical source
        run: |
          REVIEWED="$(node -p "require('./mainnet-release.json').reviewedCommit")"
          git cat-file -e "$REVIEWED^{commit}"
          git diff --exit-code "$REVIEWED"..HEAD --             contracts/src             contracts/script/DeployProduction.s.sol             contracts/script/ActivateProduction.s.sol             contracts/script/PrepareGovernanceAcceptance.s.sol             app/launch             lib/fortune-network.ts             app/api/public/v1/readiness/route.ts             mainnet-dependencies.json             scripts/check-mainnet-dependencies.mjs             scripts/export-mainnet-dependencies.mjs             package.json             package-lock.json             next.config.ts             .github/workflows/mainnet-deploy-paused.yml             .github/workflows/mainnet-activation-preflight.yml             .github/workflows/mainnet-readiness.yml             .github/workflows/mainnet-node-security.yml             .github/workflows/mainnet-audit-bundle.yml

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09

        with:

          version: v1.8.3
      - name: Require mainnet credentials and dependencies
        run: |
          test -n "$PRIVATE_KEY"
          test -n "$BSC_RPC_URL"
          node scripts/check-mainnet-dependencies.mjs --require-assets --check-env
          test "$(cast chain-id --rpc-url "$BSC_RPC_URL")" = "56"
          test -n "$FORTUNE_GOVERNANCE"
          test -n "$FORTUNE_AUTOMATION_EXECUTOR"
          test -n "$FORTUNE_PROTOCOL_TREASURY"
          test "$(cast code "$FORTUNE_GOVERNANCE" --rpc-url "$BSC_RPC_URL")" != "0x"
          test "$(cast code "$FORTUNE_AUTOMATION_EXECUTOR" --rpc-url "$BSC_RPC_URL")" != "0x"
          test "$(cast code "$FORTUNE_PROTOCOL_TREASURY" --rpc-url "$BSC_RPC_URL")" != "0x"
          test "${FORTUNE_AUTOMATION_EXECUTOR,,}" = "${FORTUNE_GOVERNANCE,,}"
          test "${FORTUNE_PROTOCOL_TREASURY,,}" = "${FORTUNE_GOVERNANCE,,}"
          test "$(cast code "$PANCAKE_V3_FACTORY" --rpc-url "$BSC_RPC_URL")" != "0x"
          test "$(cast code "$PANCAKE_V3_POSITION_MANAGER" --rpc-url "$BSC_RPC_URL")" != "0x"
          test "$PRODUCTION_ASSET_COUNT" = "1"

      - name: Install Solidity libraries
        working-directory: contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@69c8def5f222ff96f2b5beff05dfba996368aa79 --no-commit
          forge install foundry-rs/forge-std@8bbcf6e3f8f62f419e5429a0bd89331c85c37824 --no-commit

      - name: Final mainnet-candidate fuzz gate
        working-directory: contracts
        run: forge test --fuzz-runs 10000 -vvv

      - name: Dry-run production deployment
        working-directory: contracts
        run: |
          forge script script/DeployProduction.s.sol:DeployProduction             --rpc-url "$BSC_RPC_URL"             -vvv 2>&1 | tee /tmp/fortune-mainnet-dry-run.log

      - name: Broadcast paused production deployment
        working-directory: contracts
        run: |
          set -o pipefail
          forge script script/DeployProduction.s.sol:DeployProduction             --rpc-url "$BSC_RPC_URL"             --broadcast             -vvv 2>&1 | tee /tmp/fortune-mainnet-deploy.log

          grep -q "LaunchesPaused true" /tmp/fortune-mainnet-deploy.log
          grep -q "IMPORTANT: production launches remain paused" /tmp/fortune-mainnet-deploy.log

      - name: Record source commit
        run: git rev-parse HEAD | tee /tmp/fortune-mainnet-source-commit.txt

      - name: Upload paused deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortune-mainnet-paused-deployment
          path: |
            /tmp/fortune-mainnet-dry-run.log
            /tmp/fortune-mainnet-deploy.log
            /tmp/fortune-mainnet-source-commit.txt
            contracts/broadcast/DeployProduction.s.sol/56/
          retention-days: 90
