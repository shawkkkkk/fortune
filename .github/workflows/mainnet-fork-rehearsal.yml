name: Fortune BSC Mainnet Fork Rehearsal

on:
  push:
    branches: [main]
    paths:
      - "mainnet-dependencies.json"
      - "contracts/src/**"
      - "contracts/test/MainnetFork.t.sol"
      - ".github/workflows/mainnet-fork-rehearsal.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: fortune-mainnet-fork-rehearsal
  cancel-in-progress: true

jobs:
  fork-rehearsal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BSC_MAINNET_FORK_RPC_URL: ${{ secrets.BSC_MAINNET_FORK_RPC_URL || 'https://bsc-dataseed.bnbchain.org' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Require pinned production asset
        run: npm run mainnet:deps:require

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09

        with:

          version: v1.8.3
      - name: Install Solidity libraries
        working-directory: contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@69c8def5f222ff96f2b5beff05dfba996368aa79 --no-commit
          forge install foundry-rs/forge-std@8bbcf6e3f8f62f419e5429a0bd89331c85c37824 --no-commit

      - name: Run BSC mainnet fork lifecycle
        working-directory: contracts
        run: |
          forge test             --match-contract FortuneMainnetForkTest             --fuzz-runs 1000             -vvv
