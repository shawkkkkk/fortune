name: Fortune Mainnet Node Security

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mainnet-node-security.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependency graph when locked
        run: |
          npm ci

      - name: Record locked top-level runtime versions
        run: npm ls --depth=0

      - name: Capture full dependency audit
        run: |
          npm audit --json > /tmp/fortune-npm-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/fortune-npm-audit.json", "utf8"));
          console.log(JSON.stringify(report.metadata?.vulnerabilities || {}, null, 2));
          NODE

      - name: Reject high or critical production dependency findings
        run: npm audit --omit=dev --audit-level=high

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortune-mainnet-node-security
          path: /tmp/fortune-npm-audit.json
          if-no-files-found: ignore
          retention-days: 90
