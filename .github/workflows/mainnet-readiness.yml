name: Fortune Mainnet Readiness

on:
  push:
    branches: [main]
    paths:
      - "mainnet-release.json"
      - "mainnet-dependencies.json"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "app/launch/**"
      - "lib/fortune-network.ts"
      - "lib/bsc-rpc.ts"
      - "scripts/check-mainnet-release.mjs"
      - "scripts/check-mainnet-dependencies.mjs"
      - "scripts/export-mainnet-dependencies.mjs"
      - "lib/mainnet-release.ts"
      - "contracts/src/**"
      - "contracts/script/DeployProduction.s.sol"
      - "contracts/script/ActivateProduction.s.sol"
      - "contracts/script/PrepareGovernanceAcceptance.s.sol"
      - "docs/MAINNET_READINESS.md"
      - ".github/workflows/mainnet-*.yml"
  workflow_dispatch:

jobs:
  readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Reject high or critical production dependency findings
        run: npm audit --omit=dev --audit-level=high

      - name: Validate release manifest
        run: npm run mainnet:check

      - name: Validate pinned mainnet dependencies
        run: npm run mainnet:deps

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09

        with:

          version: v1.8.3
      - name: Install Solidity libraries
        working-directory: contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@69c8def5f222ff96f2b5beff05dfba996368aa79 --no-commit
          forge install foundry-rs/forge-std@8bbcf6e3f8f62f419e5429a0bd89331c85c37824 --no-commit

      - name: Mainnet-candidate contract suite
        working-directory: contracts
        run: forge test --fuzz-runs 5000 -vvv
