name: Omnichain Testnet Engine
on:
  pull_request:
    paths: ["contracts-omnichain/**", ".github/workflows/omnichain-engine.yml"]
  push:
    branches: [main]
    paths: ["contracts-omnichain/**", ".github/workflows/omnichain-engine.yml"]
permissions:
  contents: read
jobs:
  token-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts-omnichain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Install pinned test-only forge-std
        run: |
          git clone https://github.com/foundry-rs/forge-std.git lib/forge-std
          git -C lib/forge-std checkout 8bbcf6e3f8f62f419e5429a0bd89331c85c37824
      - name: Compile and test local endpoint lifecycle with 1000 fuzz runs
        run: npm test
      - name: Verify formatting and token size
        run: |
          node scripts/run-forge.mjs fmt --check src/FortuneOmnichainToken.sol test/FortuneOmnichainToken.t.sol
          node scripts/check-sizes.mjs
