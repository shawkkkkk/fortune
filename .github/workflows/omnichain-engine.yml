name: Omnichain Testnet Engine
on:
  pull_request:
    paths: ["contracts-omnichain/**", "lib/omnichain-route.ts", "lib/omnichain-burn-receipt.ts", "scripts/inspect-permanent-burn.mjs", "tests/web/omnichain-burn-receipt.test.mjs", "scripts/inspect-omnichain-route.mjs", "tests/web/omnichain-route.test.mjs", "lib/arbitrage-receipts.ts", "lib/strategy-executor-abi.ts", "scripts/arbitrage-fill-journal.mjs", "scripts/arbitrage-observer-queue.mjs", "scripts/revalidate-arbitrage-fills.mjs", "scripts/strategy-native-gas-budget.mjs", "scripts/reconcile-budgeted-receipt.mjs", "scripts/register-ts.mjs", "package.json", "package-lock.json", ".github/workflows/omnichain-engine.yml"]
  push:
    branches: [main]
    paths: ["contracts-omnichain/**", "lib/omnichain-route.ts", "lib/omnichain-burn-receipt.ts", "scripts/inspect-permanent-burn.mjs", "tests/web/omnichain-burn-receipt.test.mjs", "scripts/inspect-omnichain-route.mjs", "tests/web/omnichain-route.test.mjs", "lib/arbitrage-receipts.ts", "lib/strategy-executor-abi.ts", "scripts/arbitrage-fill-journal.mjs", "scripts/arbitrage-observer-queue.mjs", "scripts/revalidate-arbitrage-fills.mjs", "scripts/strategy-native-gas-budget.mjs", "scripts/reconcile-budgeted-receipt.mjs", "scripts/register-ts.mjs", "package.json", "package-lock.json", ".github/workflows/omnichain-engine.yml"]
permissions:
  contents: read
jobs:
  token-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts-omnichain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Install pinned test-only forge-std
        run: |
          git clone https://github.com/foundry-rs/forge-std.git lib/forge-std
          git -C lib/forge-std checkout 8bbcf6e3f8f62f419e5429a0bd89331c85c37824
      - name: Compile and test local token and strategy lifecycles with 1000 fuzz runs
        run: npm test
      - name: Verify strategy swaps on a real Pancake V3 BSC Testnet fork
        timeout-minutes: 5
        env:
          FORTUNE_STRATEGY_FORK_RPC_URL: https://bsc-testnet-dataseed.bnbchain.org
        run: |
          set -o pipefail
          mkdir -p .tmp
          node scripts/run-forge.mjs test --match-contract FortuneTestnetStrategyVaultForkTest -vv | tee .tmp/strategy-fork.log
      - name: Verify formatting and token size
        run: |
          node scripts/run-forge.mjs fmt --check src test
          node scripts/check-sizes.mjs
          node scripts/export-strategy-abi.mjs --check
      - name: Install pinned isolated local EVM runner
        run: npm install --prefix /tmp/fortune-strategy-anvil --no-package-lock --ignore-scripts --no-audit @foundry-rs/anvil-linux-amd64@1.7.1
      - name: Install locked receipt-reader dependencies
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Verify paused route configuration across two local zero-account EVMs
        timeout-minutes: 3
        working-directory: .
        env:
          FORTUNE_ANVIL_BIN: /tmp/fortune-strategy-anvil/node_modules/@foundry-rs/anvil-linux-amd64/bin/anvil
        run: |
          set -o pipefail
          mkdir -p .tmp
          node --import ./scripts/register-ts.mjs contracts-omnichain/scripts/route-observation-runtime.mjs 2>&1 | tee .tmp/omnichain-route-runtime.log
      - name: Preserve local route configuration verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testnet-omnichain-route
          path: |
            .tmp/omnichain-route-runtime.log
            .tmp/omnichain-route-runtime.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify queued receipts, budget reconciliation and rollback quarantine through local RPC
        timeout-minutes: 5
        working-directory: .
        env:
          FORTUNE_ANVIL_BIN: /tmp/fortune-strategy-anvil/node_modules/@foundry-rs/anvil-linux-amd64/bin/anvil
          FORTUNE_STRATEGY_FORK_RPC_URL: https://bsc-testnet-dataseed.bnbchain.org
        run: |
          set -o pipefail
          mkdir -p .tmp
          node --import ./scripts/register-ts.mjs contracts-omnichain/scripts/strategy-vault-runtime.mjs 2>&1 | tee .tmp/strategy-runtime.log
      - name: Preserve strategy fork verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testnet-strategy-fork
          path: |
            contracts-omnichain/.tmp/strategy-fork.log
            .tmp/strategy-runtime.log
            .tmp/strategy-runtime.json
          if-no-files-found: warn
          retention-days: 14
