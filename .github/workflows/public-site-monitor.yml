name: Fortune Public Site Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: fortune-public-site-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORTUNE_BASE_URL: ${{ vars.FORTUNE_PUBLIC_SITE_URL || 'https://fortune-rho-snowy.vercel.app' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.FORTUNE_PUBLIC_SITE_URL || 'https://fortune-rho-snowy.vercel.app' }}
      FORTUNE_REQUIRE_READY: 'true'
      FORTUNE_REQUIRE_ONCHAIN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe site, release state and reproducible onchain APIs
        run: |
          set -o pipefail
          node scripts/release-smoke.mjs 2>&1 | tee /tmp/fortune-public-site-smoke.log
      - name: Retain monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortune-public-site-smoke
          path: /tmp/fortune-public-site-smoke.log
          retention-days: 14
