name: Patched Web Dependency Candidate
on:
  pull_request:
    paths: ["security/web-runtime/**", "scripts/check-web-security-candidate.mjs", ".github/workflows/web-security-candidate.yml"]
  push:
    branches: [main]
    paths: ["security/web-runtime/**", "scripts/check-web-security-candidate.mjs", ".github/workflows/web-security-candidate.yml"]
permissions:
  contents: read
jobs:
  patched-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install isolated browser runner
        timeout-minutes: 5
        run: |
          npm install --prefix /tmp/fortune-patched-browser --no-package-lock --ignore-scripts --no-audit playwright@1.63.0
          /tmp/fortune-patched-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Audit, build and test isolated patched web candidate
        env:
          FORTUNE_PLAYWRIGHT_MODULE: /tmp/fortune-patched-browser/node_modules/playwright/index.mjs
          FORTUNE_SECURITY_REPORT_DIR: .tmp/web-security-candidate
        run: node scripts/check-web-security-candidate.mjs
      - name: Preserve candidate audit and verification result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patched-web-security-candidate
          path: .tmp/web-security-candidate/
          if-no-files-found: error
          retention-days: 14
