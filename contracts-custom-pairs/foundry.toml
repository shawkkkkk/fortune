[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../contracts/lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz = { runs = 1000 }
invariant = { runs = 128, depth = 64, fail_on_revert = false }

[rpc_endpoints]
bsc = "${BSC_FORK_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
