[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz = { runs = 1000 }
invariant = { runs = 128, depth = 64, fail_on_revert = false }
remappings = ["@layerzerolabs/=node_modules/@layerzerolabs/", "@openzeppelin/=node_modules/@openzeppelin/", "forge-std/=lib/forge-std/src/"]
